_target_: models.tokenizer.Tokenizer

vocab_size: 512
embed_dim: 512
# 3-level residual HRVQ (gradient codebooks). Level 0 is the WM-facing token
# stream (vocab_size codes); levels 1-2 refine reconstruction. commitment beta=1
# per level, matching IRIS's stock VQVAE loss.
hrvq_num_codes: [512, 512, 512]
hrvq_commitment_costs: [1.0, 1.0, 1.0]
encoder:
  _target_: models.tokenizer.Encoder
  config:
    _target_: models.tokenizer.EncoderDecoderConfig
    resolution: 64
    in_channels: 3
    z_channels: 512
    ch: 64
    ch_mult: [1, 1, 1, 1, 1]
    num_res_blocks: 2
    attn_resolutions: [8, 16]
    out_ch: 3
    dropout: 0.0
decoder:
  _target_: models.tokenizer.Decoder
  config: ${..encoder.config}